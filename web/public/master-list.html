<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master List — Board Game Database</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .page-content { max-width: 960px; margin: 0 auto; padding: 24px 20px; }

    /* Controls */
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
    }

    .filter-group {
      display: flex;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .filter-btn {
      padding: 8px 14px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .filter-btn:not(:last-child) { border-right: 1px solid var(--border); }

    .filter-btn.active {
      background: var(--accent);
      color: #241b0d;
      font-weight: 600;
    }

    .filter-btn:hover:not(.active) { background: var(--border); color: var(--text); }

    .sort-select {
      padding: 8px 30px 8px 12px;
      font-size: 13px;
    }

    .result-count {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Game List */
    .game-list { display: flex; flex-direction: column; gap: 7px; }

    .game-item {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      border-left: 3px solid var(--border);
      transition: background 0.15s, border-color 0.15s;
    }

    .game-item:hover { background: var(--elevated); border-left-color: var(--text-faint); }
    .game-item.researched { border-left-color: var(--success); }

    .game-content { flex: 1; min-width: 0; }

    .game-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }

    .game-name { font-weight: 600; font-size: 15px; color: var(--text); }
    .game-year { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    .nom-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--chip-mechanic-bg);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .done-badge {
      background: var(--chip-designer-bg);
      color: var(--success);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .sources-row { display: flex; flex-wrap: wrap; gap: 4px; }

    .source-chip {
      font-size: 11px;
      padding: 2px 7px;
      background: var(--elevated);
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    /* States */
    .state-message {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
    }

    .state-message h2 { color: var(--text); margin-bottom: 8px; }

    @media (max-width: 640px) {
      .controls { gap: 6px; }
      .search-input { min-width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-title">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2.2 C13.93 2.2 15.5 3.77 15.5 5.7 C15.5 6.73 15.05 7.66 14.34 8.3 C15.49 8.78 16.55 9.47 17.5 10.32 C18.45 11.18 19.9 11.4 20.85 12.3 C21.58 13 22 13.97 22 15 V16.5 H14.62 C15.07 17.87 15.94 19.08 16.85 20.2 C17.2 20.63 17.4 21.17 17.4 21.72 C17.4 21.87 17.28 22 17.12 22 H13.4 C13.1 20.4 12.8 18.9 12 18.5 C11.2 18.9 10.9 20.4 10.6 22 H6.88 C6.72 22 6.6 21.87 6.6 21.72 C6.6 21.17 6.8 20.63 7.15 20.2 C8.06 19.08 8.93 17.87 9.38 16.5 H2 V15 C2 13.97 2.42 13 3.15 12.3 C4.1 11.4 5.55 11.18 6.5 10.32 C7.45 9.47 8.51 8.78 9.66 8.3 C8.95 7.66 8.5 6.73 8.5 5.7 C8.5 3.77 10.07 2.2 12 2.2 Z"/>
        </svg>
        <span>Board Game <span class="brand-thin">Database</span></span>
      </div>
      <nav class="site-nav">
        <a href="/">Games</a>
        <a href="/images">Images</a>
        <a href="/master-list" class="active">Master List</a>
      </nav>
    </div>
  </header>

  <div class="page-content">
    <div class="page-hero">
      <h1>Master List</h1>
      <p class="hero-sub">The canonical catalog — every known game, tracked from discovery to researched entry.</p>
      <div class="stat-row">
        <div class="stat-tile">
          <div class="stat-value gold" id="researched-count">0</div>
          <div class="stat-label">Researched</div>
        </div>
        <div class="stat-tile">
          <div class="stat-value" id="total-count">0</div>
          <div class="stat-label">In Master List</div>
        </div>
        <div class="stat-tile coverage-tile">
          <div class="stat-value" id="pct-text">0%</div>
          <div class="stat-label">Complete</div>
          <div class="meter"><div class="meter-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <input
        class="search-input"
        id="search"
        type="text"
        placeholder="Search by name..."
        autocomplete="off"
      >
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>
      <select class="sort-select" id="sort-select">
        <option value="nominations">Most nominated</option>
        <option value="alpha">A &rarr; Z</option>
        <option value="year-desc">Newest first</option>
        <option value="year-asc">Oldest first</option>
      </select>
    </div>

    <div class="result-count" id="result-count">Loading...</div>

    <div id="game-list" class="game-list">
      <div class="state-message">
        <div class="spinner"></div>
        <p>Loading master list...</p>
      </div>
    </div>
  </div>

  <script>
    let allGames = [];
    let displayGames = [];
    let searchQuery = '';
    let statusFilter = 'all';
    let sortBy = 'nominations';

    const gameListEl = document.getElementById('game-list');
    const searchEl = document.getElementById('search');
    const sortEl = document.getElementById('sort-select');
    const resultCountEl = document.getElementById('result-count');
    const researchedEl = document.getElementById('researched-count');
    const totalEl = document.getElementById('total-count');
    const pctEl = document.getElementById('pct-text');
    const fillEl = document.getElementById('progress-fill');

    async function init() {
      try {
        const res = await fetch('/api/master-list');
        if (!res.ok) throw new Error('Failed to load');
        const data = await res.json();
        allGames = data.games;
        const pct = data.total > 0 ? Math.round((data.researched / data.total) * 100) : 0;
        researchedEl.textContent = data.researched.toLocaleString();
        totalEl.textContent = data.total.toLocaleString();
        pctEl.textContent = pct + '%';
        fillEl.style.width = pct + '%';
        applyAndRender();
      } catch (err) {
        gameListEl.innerHTML = `<div class="state-message"><h2>Failed to load</h2><p>${err.message}</p></div>`;
      }
    }

    function applyAndRender() {
      let games = allGames.slice();
      if (statusFilter === 'done') games = games.filter(g => g.researched);
      else if (statusFilter === 'pending') games = games.filter(g => !g.researched);
      if (searchQuery) { const q = searchQuery.toLowerCase(); games = games.filter(g => g.name.toLowerCase().includes(q)); }
      if (sortBy === 'nominations') games.sort((a, b) => b.source_count - a.source_count || a.name.localeCompare(b.name));
      else if (sortBy === 'alpha') games.sort((a, b) => a.name.localeCompare(b.name));
      else if (sortBy === 'year-desc') games.sort((a, b) => (b.year || 0) - (a.year || 0) || a.name.localeCompare(b.name));
      else if (sortBy === 'year-asc') games.sort((a, b) => (a.year || 0) - (b.year || 0) || a.name.localeCompare(b.name));
      displayGames = games;
      resultCountEl.textContent = `Showing ${games.length} game${games.length !== 1 ? 's' : ''}`;
      renderList(games);
    }

    function renderList(games) {
      if (games.length === 0) {
        gameListEl.innerHTML = '<div class="state-message"><h2>No games found</h2><p>Try adjusting your search or filter</p></div>';
        return;
      }
      const fragment = document.createDocumentFragment();
      for (const game of games) {
        const item = document.createElement('div');
        item.className = 'game-item' + (game.researched ? ' researched' : '');
        const content = document.createElement('div');
        content.className = 'game-content';
        const titleRow = document.createElement('div');
        titleRow.className = 'game-title-row';
        const name = document.createElement('span');
        name.className = 'game-name';
        name.textContent = game.name;
        titleRow.appendChild(name);
        if (game.year) {
          const year = document.createElement('span');
          year.className = 'game-year';
          year.textContent = game.year;
          titleRow.appendChild(year);
        }
        if (game.source_count > 1) {
          const badge = document.createElement('span');
          badge.className = 'nom-badge';
          badge.textContent = '\u2605 ' + game.source_count;
          titleRow.appendChild(badge);
        }
        if (game.researched) {
          const badge = document.createElement('span');
          badge.className = 'done-badge';
          badge.textContent = 'researched';
          titleRow.appendChild(badge);
        }
        content.appendChild(titleRow);
        if (game.sources.length > 0) {
          const sourcesRow = document.createElement('div');
          sourcesRow.className = 'sources-row';
          for (const src of game.sources) {
            const chip = document.createElement('span');
            chip.className = 'source-chip';
            chip.textContent = src;
            sourcesRow.appendChild(chip);
          }
          content.appendChild(sourcesRow);
        }
        item.appendChild(content);
        fragment.appendChild(item);
      }
      gameListEl.innerHTML = '';
      gameListEl.appendChild(fragment);
    }

    searchEl.addEventListener('input', e => { searchQuery = e.target.value.trim(); applyAndRender(); });
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        statusFilter = btn.dataset.filter;
        applyAndRender();
      });
    });
    sortEl.addEventListener('change', e => { sortBy = e.target.value; applyAndRender(); });

    init();
  </script>
</body>
</html>
