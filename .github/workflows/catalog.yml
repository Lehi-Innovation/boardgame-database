name: Catalog verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm audit --prefix web --audit-level=high

  name-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: npm ci
      - run: pip install -r examples/name-snapshot/python/requirements.txt
      - run: gem install json_schemer -v 2.5.0 --no-document
      - run: npm run names:schema:check
      - run: npm run test:names:compat

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CATALOG_TEST_ADMIN_URL: postgresql://postgres:local-test-password@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Startup output includes local credentials; keep it out of public logs.
      - run: npm run db:start > "$RUNNER_TEMP/catalog-supabase-start.log" 2>&1
      - run: npm run db:migrate
      - run: npm run test:supabase
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:db -- --advisors
        env:
          CATALOG_TEST_ADMIN_URL: postgresql://supabase_admin:postgres@127.0.0.1:55322/postgres
      - if: always()
        run: npm run db:stop
