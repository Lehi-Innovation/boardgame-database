description: |
  Add a bird to a queue at a shared feeder and compare the waiting birds’ combined strength with the bird on the perch. A stronger queue lets you collect the perched bird and, when available, a seed card, then may set off another collection as a new bird takes the perch. The size of the difference affects which food you receive, and crows or squirrels can cost you collected cards. Score seeds, male-and-female pairs matching in species and strength, and species majorities. The shared display rewards arithmetic and planning. This is Lookout’s 2018 card game, separate from the earlier children’s games with the same name.

