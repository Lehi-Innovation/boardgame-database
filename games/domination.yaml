description: |
  Domination is Milton Bradley's 1982 English edition of Sid Sackson's Focus,
  retaining the abstract stacking and capture game rather than introducing a
  separate action-point system. Control stacks with your color on top, and move
  either the entire stack or a top portion exactly as many orthogonal spaces as
  the number of pieces lifted. Combining stacks beyond five removes pieces from
  the bottom: opposing colors are captured and your own become reserves.

  Instead of moving, return a reserve piece to an empty square or a stack. In
  two-player play the goal is to prevent the opponent from making any legal
  move, including reserve placements. Three- and four-player setups also exist.
  The short explanation leads to direct tactical contests over stack ownership
  and future mobility. The German Parker Focus edition is recorded separately.

