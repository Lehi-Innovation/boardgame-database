description: |
  Guide both of your lemmings through a landscape race toward the finishing cliff. Terrain cards provide movement, with the value of shared card piles changing how far you can go; other plays reset a pile and let you alter the terrain with a bonus tile. You can push lemmings ahead, so a useful move may help a rival as well. Choosing when to move and when to refill your hand matters more than quick reactions. Both your lemmings must finish to win.

