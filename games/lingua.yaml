description: |
  Build connected words with colored letter tiles on a shared board. The colors affect scoring, including bonuses for placing letters on matching spaces, so a familiar word may be worth more in a different position. Extending the crossword toward the finish area can end the game, but the highest score wins. Vocabulary, careful placement and scorekeeping matter more than speed. This record concerns Braude’s original Ravensburger word game, first published in 1969; later Casino-series printings are separately documented. The approximate 90-minute duration is a used-set retailer’s recommendation. An original box age label has not been verified.

