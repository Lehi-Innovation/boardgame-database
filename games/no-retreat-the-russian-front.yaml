description: |
  Direct Axis or Soviet armies across the Eastern Front of the Second World War.
  Units move on a hex map, while event cards influence the fighting and create
  opportunities for counterattacks. Supply, timing and the changing strength of
  the armies matter alongside taking territory.

  This record represents GMT's 2011 deluxe edition, which develops Victory Point
  Games' smaller 2008 No Retreat! and its expansions. The GMT rules list one set
  of 55 event cards, not a separate 55-card deck for each side. Expect a demanding
  two-player campaign with different pressures on the opposing armies; experience
  ratings and duration estimates remain provisional.

