description: |
  Move your pieces across a board whose printed arrows determine the available directions. Both players can see those paths, so planning involves anticipating how an opponent can approach or escape. The medieval pieces and arrow-marked spaces offer a different way to follow a two-player capture contest.

  This record represents Parker Brothers' 1979 All the King's Men. The Strong Museum distinguishes it from the related 1970 Smess: The Ninny's Chess, whose presentation and some rules differ. They share a family rather than an interchangeable edition identity. Timing and experience assessments remain provisional.

