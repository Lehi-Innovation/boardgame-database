description: |
  Two players control opposing boxing robots and try to land a punch that makes
  the rival's head pop up. The action happens through hand controls rather than
  a sequence of card or board-game turns. Expect a brief contest of reactions
  and repeated challenges; that experience assessment remains provisional.

  This record represents the original Marx game. The Strong National Museum of
  Play dates its original-game object to 1964, and Mattel's later history also
  identifies 1964 as the starting year. Later products, including Knock or Block,
  add rules such as a die; those features and their age labels are not assumed
  to describe this original version.

