description: |
  Outmaneuver one opponent on a circular board, capturing pieces by trapping them between your own. The aim is to leave your rival with only one piece. This is Luca Lamberti’s Italian abstract game, published by Jokerman in 1997. Its basic game is described as having no chance element, with a separate variant adding uncertainty. Expect direct tactical competition and close attention to positioning. Detailed original movement rules and age guidance remain unverified; the short session estimate is provisional.

