description: |
  Rebuild London after the Great Fire by choosing buildings for your personal display and buying boroughs on the shared city map. On your turn, choose whether to develop your display, acquire land, run your city or draw more cards. Running the city pays out its active buildings, but leaves poverty to manage; a promising expansion can become expensive if your hand and display grow unchecked. The tension comes from building combinations while planning when to activate them. This record represents Treefrog’s original 2010 edition with a borough map, separate from Osprey’s 2017 revision.

