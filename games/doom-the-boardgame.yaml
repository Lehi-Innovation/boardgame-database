description: |
  One invader player directs demons and plays surprise events against one to
  three marines exploring a Mars base. The marines share a goal, pick up weapons
  and supplies, and manage limited ammunition while fighting through rooms and
  corridors. Randomly dealt marine abilities and dice-driven attacks make plans
  uncertain; movement, timing and cooperation still matter.

  Each scenario supplies its map, special rules and victory conditions. Many give
  the invader a target number of marine kills, but neither six kills nor reaching
  an exit is a universal objective. This record represents Wilson's original
  English 2004 game. The separately redesigned 2016 DOOM game has different rules
  and specifications. The original credits Petersen with additional design and
  development, and Nicely/id Software with graphics.

