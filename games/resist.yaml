description: |
  Lead a small band of Spanish resistance fighters on missions against the Francoist regime. Play fighters concealed to keep them available for later, or reveal them for stronger actions that will usually remove them from your deck. Decide how much strength to spend overcoming enemies and completing a mission, knowing that casualties and failures can end the resistance. After a successful round, choose whether to stop with your score or risk another assignment with a weaker band. The tension comes from spending people and opportunities that you may not recover. This is a solo card game with standard scoring and scenario options; the record represents the 2023 U.S. English edition.

