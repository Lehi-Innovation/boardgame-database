description: |
  Two players place tiles and followers inside a fixed castle wall, building
  paths, houses, towers and courts. Completing features earns points, while
  landing on special spaces on the wall's scoring track can award useful
  bonus tiles. The confined playing area makes nearby placements matter to
  both players.

  Reiner Knizia designed this standalone game using Klaus-Jürgen Wrede's
  Carcassonne system. It is also called Die Burg or The Castle. Expect a spatial
  contest over completing features and choosing when to score; that experience
  assessment remains provisional. It is separate from Mayfair's 1981 The Castle
  and Faidutti and Laget's 2000 card game Castle.

