description: |
  A Dutch quiz built around questions whose answers can change: an officeholder, a sporting champion or yesterday’s news. The printed question cards were paired with answers obtained online, keeping the subject matter tied to the day rather than a fixed answer booklet. It suits a group interested in current affairs, with Dutch reading and internet access central to the original format. Before using an old set, check whether its required answer service is still accessible; current availability has not been verified. This record represents Identity Games’ 2007 Dutch game, with supported counts from an actual-set collector listing. Original session duration remains unknown.

