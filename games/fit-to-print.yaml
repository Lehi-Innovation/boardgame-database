description: |
  Assemble a woodland newspaper by collecting articles, photographs and advertisements, then fitting them around a centerpiece. In the timed game, everyone searches the shared tile supply at once, switches to arranging their own page and tries to finish before the deadline. Too many spare tiles cost points, while too little advertising can put a paper out of business. Play covers three newspaper editions with growing pages. The base game supports one to six players; solo puzzles, a turn-based option and a separate team Newsroom mode offer other ways to play. This record represents the original English 2023 release, distinct from its 2022 crowdfunding campaign. Experience and preferred-count estimates remain provisional.

