# Description
description: |
  Buy hotel-chain shares and place tiles that found, expand or merge companies.
  Merger payouts reward the leading shareholders of the absorbed chain, supplying
  cash to invest again. Stock purchases have listed prices; they are not auctions.
  You must judge which chains will grow and when a merger benefits your rivals.

  This record represents 3M's 1964 mass-market edition, with three share purchases
  per turn and a founder's bonus share. Archival investigations distinguish it
  from the limited 1963 World Map test release, whose stock and purchase rules
  differed. The 1962 copyright on packaging is not evidence of a 1962 release.

