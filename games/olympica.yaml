description: |
  Raid a Martian stronghold to seize the Web Mind Generator before its defenders can stop you. One player commands United Nations infantry, laser tanks and airborne troops; the other uses defensive positions, tunnels and the generator’s influence. Hidden defenses and different capabilities give the two sides different problems to solve. This is Lynn Willis’s 1978 Metagaming microgame, with a small hex map and counters. It offers introductory and advanced scenarios, with more rules to manage than its compact package suggests. Original age and duration labels remain unverified; the session estimate is provisional.

