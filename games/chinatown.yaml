description: |
  Negotiate over building lots, shop tiles and money in New York's Chinatown. Assemble neighboring shops into larger businesses, collect income and finish six rounds with the most cash. The lots and shops you receive may suit someone else better, making conversation and bargaining central to play. This record follows the original 1999 Alea edition, set in the 1930s and including economic-condition cards that can change income. Later editions change the period, presentation and some rules; their publisher and specifications are not automatically those of this edition. Published duration estimates range from about an hour to ninety minutes. Preferred counts and experience ratings remain provisional.

