# Description
description: |
  Cook miniature dishes by rolling to heat your stove and tipping tiny seasoning
  pieces from bottles into a pan. Each recipe needs the right ingredients and
  heat; too much seasoning or a burnt dish costs points. The bottle may release
  nothing or far more than you wanted, making careful hands and sudden mishaps
  part of the fun. Some actions also disrupt another cook's work.

  This is Schmiel's original 1989 Moskito game for three or four, with its
  clothespin stove markers. Later revised editions have different components and
  specifications; their two-player support and illustration credits are not
  assumed here. The original placed second in the 1990 Deutscher Spielepreis.

