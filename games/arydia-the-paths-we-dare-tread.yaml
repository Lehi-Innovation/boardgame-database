# Description
description: |
  Explore a fantasy world together, develop a character and take turns portraying the people you encounter. Travel, dialogue, puzzles and tactical battles unfold across a long campaign, with a save system for continuing another day. Enemy cards and positional combat patterns resolve battles without a game master. The publisher describes more than forty hours of play; individual sitting lengths are flexible, and substantial components need organizing. The game can be reset, using erasable marks, sleeves, printable character sheets or tokens to preserve replayability. This record follows the original English first printing, with finished copies documented in December 2024 and regional fulfillment continuing in 2025. Age labels remain unverified for this printing, and experience and preferred-count estimates are provisional.

