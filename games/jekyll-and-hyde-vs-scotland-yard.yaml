description: |
  Two players cooperate as Jekyll and Hyde, trying to reach a precise destination
  before Scotland Yard catches them. Each chapter lasts two rounds of card tricks.
  Sharing the tricks helps the pair advance, but particular cards and excess
  movement can help their pursuer. Communication is restricted, so partners must
  coordinate through the cards they play.

  This is a standalone cooperative game, distinct from the competitive Jekyll vs.
  Hyde. Ten chapters introduce and vary its rules. Expect a short, concentrated
  partnership puzzle; that experience description remains a provisional estimate.

