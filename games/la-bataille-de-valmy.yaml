description: |
  Maneuver French and Prussian units at the 1792 Battle of Valmy in this two-player historical hex-and-counter game. An independent retrospective describes Jean-Jacques Petit's design as a variation on the Napoleon's Last Battles model, with regimental and battalion units; its title alone does not establish membership in the separate La Bataille series. This record represents the original 1981 Jeux Descartes release. The nominal three-hour duration comes from that retrospective, while experience ratings remain provisional.

