description: |
  Build pirate camps and connecting ships around resource-producing islands.
  Rolls supply equipment cards such as wood, wool, rum and cutlasses. Trade at
  the marketplace, with other players or with the supply, and use Coco cards for
  help. The first player to place all seven camps wins.

  This is KOSMOS's original German 2007 Junior game for three or four. Ordinary
  supply trades cost three matching cards, with ports improving the rate; a six
  moves the ghost pirate to block production without the later English version's
  automatic two-resource reward. The 2012 Mayfair game has different components,
  trading rules and two-player support. Published duration estimates differ, so
  allow extra time for this earlier version when learning with children.

