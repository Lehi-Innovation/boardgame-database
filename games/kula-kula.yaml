description: |
  Kula Kula is a canoe race around Pacific islands, collecting shells and
  exchanging them for more valuable cowries. Move cautiously one point at a
  time, or consult the oracle by revealing cards to travel farther. Revealing
  an idol stops the journey instead, so extra movement comes with the risk of
  making no progress. A spinning dolphin indicates where a new shell appears.

  Reach islands while they still have cowries to exchange, and collect enough
  to win. The Blatz edition's wooden canoes, dolphin and real shells earned the
  1993 special award for a beautiful game. This record represents that version,
  distinct from the earlier Edition Perlhuhn issue; its specifications are not
  a claim that both packages had identical materials or instructions.

