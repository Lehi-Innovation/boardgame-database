description: |
  Run a competing mail business along the Pony Express route from Missouri to California. Unlike the later Funforge racing game, this 1947 Polygon game casts players as rival owners trying to put one another out of business. The Strong museum identifies a surviving copy, and the collectors’ catalog credits Bert J. Bratt. The original instructions remain uninspected, so player limits, age guidance, duration and the precise ending are currently unknown.

