description: |
  Invent a fictional date that will appeal to the round’s judge by combining two positive-trait cards. Then add a terrible trait to the date offered by the player on your left. Everyone argues why their flawed candidate is still the best choice, and the judge picks a winner. The fun depends on reading the judge’s tastes and improvising explanations for awkward combinations. This is a party game about persuasion and made-up dates, with adult humor, rather than deducing hidden roles. Choose the session length together: the transcribed rules suggest two turns around the table, a seven-point target or simply stopping when the group is ready.

