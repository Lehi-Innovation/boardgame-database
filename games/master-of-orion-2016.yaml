description: |
  Develop a space civilization by spending actions and resources to play useful cards into planetary systems. Cards build your economy and provide abilities, but a new card can cover an older ability, creating choices about what to keep available. Balance resource production, fleet strength and loyalty while seeking points. This is the original Russian-language Hobby World release from 2016, before Cryptozoic's separately recorded 2017 English edition. The publisher lists two to four players, ages twelve upward and forty to sixty minutes; preferred counts and experience ratings remain provisional.

