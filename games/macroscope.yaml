description: |
  Peek through a few windows at a hidden drawing and decide whether you have seen enough to name it. Dice determine which numbered covers you may remove, but revealing more makes a correct guess worth less: unopened windows determine the reward or penalty. Other players can challenge a guess or take a chance when the active player passes. Ten pictures make a game. The shared picture encourages everyone to watch, while the risk of an expensive mistake keeps early guesses tense. This record represents Mayday’s 2017 English edition of the earlier Lifestyle game.

