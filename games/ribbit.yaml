description: |
  Race five colored frogs while keeping your own frog’s color secret. Play movement cards that can help a rival as well as yourself, and use stacks to carry riders along when a frog underneath moves. A small hand of cards gives children simple choices, while hidden colors encourage guessing and bluffing. This is SimplyFun’s 2007 frog version of Knizia’s turtle race; the original English finish-stack tiebreak remains unverified. Specified frog pieces sold from March through October 2007 were recalled for lead in their paint under CPSC notice 08-056. Consult that official notice before using an old copy; the recall is not evidence against unrelated turtle editions or replacement pieces.

