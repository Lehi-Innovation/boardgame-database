description: |
  Secretly choose how many dice and which lure tokens to commit, then reveal together. Players using fewer dice fish first, but larger rolls have a better chance of meeting a valuable fish’s requirements. Roll, use the lures you committed and take every fish you qualify to catch; rivals may empty the water before a later turn arrives. Special dice need a round to recover after use. When the fish deck runs out, finish the round and compare points.

