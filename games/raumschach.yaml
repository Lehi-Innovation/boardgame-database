# Consulted historical-text reproductions for the five-board Normal Form: two
# unicorns and ten pawns per side, single pawn steps with no initial double step.
# Maack’s 1913 five-space arrangement has only five pawns per side, so it is not
# silently combined with Normal Form. The often-quoted 1907 date is early invention/
# development, not a verified first publication of this exact ruleset; year unknown.
# Reproductions omit original diagrams; original book scans were not inspected and
# the site’s public-domain label is not a permission assessment. Generic 3D chess
# is a family, not a universal alias; its overview is archived unchanged with no
# arbitrary redirect. Two players confirmed; age unknown. About 60 minutes, preferred
# count and all experience ratings are provisional, not printed duration bounds.
