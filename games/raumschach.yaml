description: |
  Play a chess-like contest across five stacked boards, each five squares wide and deep. Attacks can pass between levels as well as across a board. Rooks travel through the faces of imaginary cubes, bishops along their edges, and unicorns diagonally through their corners. Keeping track of threats requires you to picture the whole space, not just the board holding your king. This record represents the documented Normal Form, with twenty pieces per side including ten pawns and two unicorns. Its pawns have no initial double move. Earlier Maack arrangements and other three-dimensional chess games use different setups; agree on the chosen rules before playing.

