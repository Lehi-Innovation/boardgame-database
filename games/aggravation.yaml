description: |
  This record represents CO-5's four-player Aggravation set documented in 1962,
  rather than later six-player deluxe boards. Each player races four marbles
  from base around a track into home. Roll a one or six to bring a marble into
  play, then choose which marble to advance with subsequent rolls. Landing on
  another player's marble sends it back to base, making even a nearly completed
  circuit vulnerable to a setback. Get all four marbles home first to win.

  Its dice-driven progress and direct captures suit players who enjoy a simple
  race with frequent reversals. Wahoo is represented separately as a traditional
  marble-racing game with board and house-rule variations; this commercial set's
  date, age recommendation and four-player limit do not apply to every version.

# Collector's actual-set inventory gives 1962, 2–4 and 5+; AGPI independently
