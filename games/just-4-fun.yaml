description: |
  Just 4 Fun combines arithmetic with a contest for four controlled spaces in a
  line. Play one to four cards from your hand and add their values to choose a
  numbered square on the board. Place one stone there, then refill your hand.
  Several players can occupy a square; you control it only by having more
  stones there than anyone else, rather than merely being the latest arrival.

  Build a horizontal, vertical or diagonal line while interrupting opponents'
  plans. With the secured-field rule, a two-stone lead can lock a square. If nobody wins
  within twenty turns each, the values of controlled squares decide the winner.
  Card luck limits your choices, but combining values gives several ways to
  reinforce a position or block an immediate threat. This record represents the
  KOSMOS numbered-board edition, distinct from the color-based standalone game.

