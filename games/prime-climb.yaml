description: |
  Roll two ten-sided dice, then add, subtract, multiply or divide to move your two pawns through a spiral of numbers. Try to bring both pawns exactly to 101. Color patterns help with arithmetic, while landing on another pawn after your moves sends it back to the start—even if it is your own. Moving onto a qualifying red prime space earns one card after movement and bumping; smaller primes and the final 101 space do not. Cards can help you move or disrupt opponents. The standard game is for two to four, with official solo challenges that count rolls instead of racing rivals. Expect roughly ten minutes per player, with arithmetic practice and setbacks.

