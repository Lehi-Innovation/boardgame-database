description: |
  Race hexagonal paddle steamers across the Mississippi with too little firewood to pay for the whole journey. Spend wood to move ahead or retreat to recover it, and position the numbered sides of your steamer against other boats to gain extra movement. Those contacts can set off chains that move rivals as well as you, making timing and orientation central to the race. A die sets starting orientations, then is put away; ordinary movement is chosen rather than rolled. The first steamer to reach or pass the finish wins. Expect arithmetic and close attention to everyone’s position.

