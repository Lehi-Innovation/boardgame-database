description: |
  Flick wooden discs toward a grid of twenty-five holes. Each turn gives you three shots, and holes farther from your own shooting edge are worth more points. A useful landing place for you may deny an opponent a valuable target, while later shots can move discs already on the board. The physical aim is straightforward; positioning and optional expert scoring add choices. The listed counts and duration describe the Steffen game reviewed in 2010. Creator and review references date the design to 2001, but the first printing and its original publisher remain unverified. This wooden game is separate from Ravensburger’s later card game.
