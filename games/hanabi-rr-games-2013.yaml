description: |
  Work together on a fireworks display while seeing everyone else's cards and keeping your own hidden from yourself. Limited clues help teammates play cards in order; discarding restores a clue but may remove a card the group needs. Three failed plays end the game, while running out of clue tokens only restricts your available actions. Otherwise, finish the five fireworks or score after the final round. This record represents R&R's 2013 English card edition, with 60 cards including an optional multicolor suit, eight clue tokens and a four-piece fuse stack that allows three mistakes. The multicolor rules are variants rather than the basic five-color game. Experience and preferred-count estimates remain provisional.

