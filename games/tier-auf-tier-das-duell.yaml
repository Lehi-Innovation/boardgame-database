description: |
  Race to build a separate tower from your tiger, goose, squirrel and octopus.
  Two dice specify the bottom and top animals for both players, who stack at the
  same time. Finish first and call for a rules check: a correct tower earns you
  a coin, while an illegal tower gives the coin to your opponent. The first player
  to collect three coins wins.

  This is HABA's multilingual 4340 set, a distinct stacking game from the farm
  animal auction game You're Bluffing! The rules also offer a tournament for
  larger groups using repeated two-player duels; they do not add simultaneous
  stacking places for everyone. Practice balancing the narrow sides before
  introducing the race, especially with children learning the shapes.

