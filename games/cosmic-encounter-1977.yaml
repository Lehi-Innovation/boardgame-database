description: |
  Take an alien power that changes an ordinary rule, then use cards, allies and
  negotiation to establish five bases outside your own system. Military strength
  helps, but an opponent's unusual power or an ally's ambitions can overturn an
  apparently straightforward challenge. Shared wins are possible.

  This is the original 1977 Eon base set with fifteen powers, four planet systems
  and four player colors. Later Eon expansions add players, flares, moons and
  other systems; they are not included here. The often-circulated 1983 Complete
  Book combines all nine expansions and therefore does not describe the original
  box's component count. Fantasy Flight's 2008 game remains a separate record.

