description: |
  Harvest apples, pears, cherries and plums together before the raven’s picture is complete. Roll the color-and-symbol die: a color collects one matching fruit, a basket allows any two fruits, and a raven adds one of nine puzzle pieces. Everyone wins or loses together. The large supply of wooden fruit makes progress easy to see, while the basket result offers a small shared choice in a game largely driven by chance. More than four players share baskets. This is HABA’s classic Orchard, first published in 1986, separate from the simplified First Orchard and Mark Tuck’s solitaire card game.
