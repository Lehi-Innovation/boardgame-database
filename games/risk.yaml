description: |
  Build armies, attack neighboring territories and try to take the entire world map. Holding a continent brings extra reinforcements, while capturing territory earns cards that can later strengthen your army. Dice make even a well-prepared attack uncertain. Rivals can negotiate temporary arrangements, but victory requires eliminating everyone else, and an eliminated player may wait a long time for the finish. This record represents Parker Brothers’ original 1959 U.S. edition for three to six players. Later two-player neutral-army rules and secret missions are separate variants. Risk 2210 A.D., Godstorm and Legacy are standalone relatives rather than required expansions.

