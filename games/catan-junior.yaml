# Description
description: |
  Collect resources from numbered islands and spend them on ships, pirate lairs
  or Coco's immediate bonuses. Ships and lairs alternate along the coast; the
  first player with seven lairs wins. A single die produces resources, while a
  six moves the Ghost Captain to block an island and gives the active player two
  resources from the supply rather than stealing from a rival.

  This is the 2012 Mayfair English MFG3025 edition for two to four. Its resource
  tiles and general two-for-one supply trade differ from the original 2007 German
  card-based game. Standard play uses the marketplace and supply; direct trades
  with other players are an optional advanced rule. Later CATAN Studio printings
  and Madagascar's separate circus game are not the original printing represented
  here.

