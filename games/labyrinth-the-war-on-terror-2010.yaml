description: |
  A strategic card-driven contest between the United States and a jihadist network after 2001. Cards can fund operations or trigger events, sometimes helping an opponent; the two sides pursue different goals through governance, influence, troops, cells and plots. Country conditions and die rolls make plans uncertain, and a substantial rules framework asks players to think beyond a single battle. Solitaire play puts the human on the US side against a rules-driven opponent. Allow three hours or more according to a contemporary played review. This record represents the original 2010 base game, with later expansions and printing revisions excluded.
