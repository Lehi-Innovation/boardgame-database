description: |
  Lead Alex, Gloria, Marty or Melman on a travelling circus tour. Resource rolls
  supply wood, wool, sand, cocktails and popcorn to build wagons and tents. Start
  with two tents and build the remaining five before your rivals. Penguin cards
  offer immediate help, while the animal-control officer can block production.

  This is the standalone 2012 German KOSMOS game, with its own board and pieces;
  another Catan Junior box is not required. The original rules credit Teuber's
  design, Madagascar 3/Resch illustrations and Kienle/Fine Tuning graphic design.
  Direct player trading is an optional advanced rule. The publisher recommends
  two to four, age six and approximately 25–35 minutes.

