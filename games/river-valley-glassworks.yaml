description: |
  Gather colorful glass from a shared river to fill your workshop. Spend a piece from your satchel on a matching river shape, then take all the glass from an adjacent segment; drawing from the lake instead refills your satchel for later turns. New colors start columns from left to right, while repeated colors build upward. You score complete stretches of rows and your two tallest columns, so a large haul can help one plan while spoiling another. Extra glass that will not fit costs points. The base game includes automated rivals for solo play. This record covers the 2024 English retail game, with acrylic pieces; Deluxe components, real-glass upgrades and expansion powers are separate.

