description: |
  Kingdoms is the 2002 Fantasy Flight fantasy retheme of Reiner Knizia's
  Auf Heller und Pfennig. Place castles and resource or hazard tiles on a shared
  grid, trying to make the rows and columns containing your castles profitable.
  Castle ranks multiply the values around them, so a powerful position can
  become a costly liability when an opponent introduces a hazard.

  Deciding when to commit a valuable castle matters alongside where it goes.
  Across three epochs, players compete for favorable lines while keeping the
  effect on opposing castles in view. The original German market-stall game
  and the later 2012 Kingdoms edition are separate editions; the 1994 date is
  not the publication year of this English fantasy box.

