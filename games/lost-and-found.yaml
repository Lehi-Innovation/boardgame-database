description: |
  Look carefully at a collection of objects, then turn the card over and try to name the item that has appeared before another player does. Different difficulty levels let children and adults adjust the memory challenge. This is Martin Nedergaard Andersen's competitive observation card game, rather than the unsupported cooperative labyrinth game previously described here. The publisher's reviewed catalog lists two to six players, ages five upward and ten to fifteen minutes. Expect quick visual recall and calling out discoveries; preferred counts and experience assessments remain provisional.

