description: |
  Work together to hunt large monsters, then turn the spoils into equipment for
  tougher encounters. Each monster behaves differently, giving the group new
  attacks to anticipate and positions to consider. Ancient Forest and Wildspire
  Waste are separate core boxes in this original World line; Iceborne is a later
  standalone game.

  Expect a sequence of demanding boss fights with equipment progression between
  hunts; that experience assessment remains provisional. Steamforged's April 2023
  announcement confirms that backers were playing World and retail release was
  planned for that year, distinguishing it from the 2021 crowdfunding campaign.

