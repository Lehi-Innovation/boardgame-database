description: |-
  Two players move four counters each around eight outer points and an empty centre, trying to leave the opponent without a legal move. There are no captures or jumps: the puzzle is about keeping an escape route while closing the other player’s options. A drawn board and two sets of four distinguishable counters are enough. This Māori game is documented from New Zealand’s East Cape; its age is uncertain. Sources record different restrictions on entering the centre, so agree on that rule before starting.
