description: |
  Place double-sided tiles on a four-by-four board and interfere with your opponent by flipping a tile into a neighboring empty space. A winning line of three matching tiles must be locked so its tiles cannot be flipped away; ordinary three-in-a-row is not enough. Each player has eight tiles, making the available spaces increasingly important. This record follows the University Games version documented by an independent 2017 play review and teaching guide, with a retailer-listed age of seven upward. Its publication year and designer credit remain unverified; the historical 1981 catalog reference is separate. Timing and experience estimates are provisional.

