description: |
  A recruiter travels secretly through Zanzibar while rogue agents try to work
  out the route and make a capture. The recruiter seeks new members for a psychic
  espionage organization; the agents share clues and deductions to stop it.
  Fourteen sealed packages add material that changes later games.

  The usual game pits one person against a team. The publisher also offers solo
  and fully cooperative play using a companion app. Expect a sustained chase
  with different information and responsibilities on each side; that experience
  assessment and the suggested group sizes remain provisional. The game is based
  on Matt Kindt's comic series and was already being reviewed in finished form
  in December 2021.

