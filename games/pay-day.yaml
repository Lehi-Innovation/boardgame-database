description: |
  Roll through a calendar month, collecting wages, receiving bills and deciding whether to buy deals that might pay off later. Borrow when necessary, manage interest and compare your finances after everyone completes the agreed number of months. Choosing the session length matters: the early rules estimate about an hour for four players playing three months, or two hours for six months. Chance drives movement and many expenses, while deals and borrowing offer a few financial choices. This record represents the U.S. Parker Brothers game advertised as new in 1975. Earlier copyright evidence and later revised editions are recorded separately.

