description: |
  Draw four Underground lines on your own London map using shared station cards.
  Each round uses a different colored pencil and starting station. Connect the
  revealed shapes while respecting crossing and route restrictions, balancing
  districts, river crossings, tourist sites and interchanges for points.

  This is the original Blue Orange English edition, independently reviewed with
  a finished copy in May 2022. Its rules support solo or one to four competing
  planners, age eight and about twenty-five minutes. Players share card draws
  but do not build a joint network. Fractal's first Spanish edition dates to
  2023; that localized release is not this original English printing.

