description: |
  Roll a color-and-symbol die and work together to gather the fruit before the raven reaches the orchard. A color collects one matching fruit, a basket lets you choose one fruit, and a raven moves the bird along its short path. Everyone shares the result, with a solo option using the same goal. Large wooden fruit and brief turns suit very young players; an adult can help with colors and turn-taking. This simplified 2009 game is separate from HABA’s older Orchard, which uses more fruit, a raven puzzle and a two-fruit basket action. No other game is required.

