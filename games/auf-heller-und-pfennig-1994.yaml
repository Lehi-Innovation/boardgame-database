description: |
  Auf Heller und Pfennig is Knizia's original market-stall placement game, later
  rethemed as Kingdoms. Place your stalls and customer tiles on a shared medieval
  marketplace. Wealthy customers improve a row or column, while troublesome
  visitors can make the same line lose money. A stall's size multiplies the
  result, increasing both its earning power and its exposure to a bad placement.

  Draw a tile, commit a stall or reveal the one tile kept privately in reserve.
  Under the consulted German rules, completed rows and columns score immediately.
  Across three rounds, recover small stalls but spend the larger ones permanently,
  deciding when a promising line warrants that commitment. Fire divides lines,
  a money bag doubles their effect, and an evil-eye tile removes the benefit of
  positive customers. Most money after the third round wins.

