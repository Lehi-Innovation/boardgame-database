# Description
description: |
  Call My Bluff is the 1997 English-language F.X. Schmid U.S.A. edition of Richard
  Borg's dice-bluffing game. Its German Bluff edition won the 1993 Spiel des Jahres;
  that award date is not this edition's publication year. Each player starts with
  five dice hidden under a cup and bids on the total number of matching faces
  across the table, with stars acting as wilds for number bids.

  Raise the bid or demand a reveal. A failed bid or mistaken challenge costs the
  loser as many dice as the gap between the bid and the actual count. If the bid
  is exactly right, everyone except its maker loses one die. Players can also
  expose some dice and reroll the rest. The last player with dice wins. Reading
  people and deciding when to challenge matter alongside the odds; eliminated
  players wait for the next game.

