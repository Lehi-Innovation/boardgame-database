description: |
  Two players explore a ghoul-infested adventure using separate paper charts, each acting as the other's game master. The revised design fits the charts and instructions onto a sheet and offers scenarios with different situations and objectives. The creator's current description gives a race to destroy eight ghouls as the goal, rather than a shared cooperative victory. Bring the chosen charts and writing tools; familiarity with a scenario can change the surprise of discovering it. This record follows the revision distributed online in 2001, separate from the original 1982 game. Timing and experience assessments remain provisional.

