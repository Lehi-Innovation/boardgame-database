description: |
  Plan the German air and sea invasion of Leros, or defend the island with British and Italian forces. This Tactical Combat Series game combines written operational plans with tactical combat on rugged terrain. Short scenarios cover part of the fighting; a full campaign uses a much larger span of the battle and can require many sessions, so agree on the scenario before choosing it for an evening.

  This record represents the original The Gamers design by David A. Friedrichs. Independent reviews date it to 1995, matching the original rules copyright; other bibliographies list 1996, so the precise first-release chronology remains uncertain. It is not the unsupported 2009 Compass Games edition previously described here. Experience ratings remain provisional.

