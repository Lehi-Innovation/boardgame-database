description: |
  Scan nine large illustrated tiles to find objects that match a mission. Challenges mix races to spot a picture, timed individual searches and bids about how many examples you can find. Changing the tile arrangement keeps everyone looking across the shared display. Quick observation matters, and a clear view is helpful when playing with a larger group. This record represents Lauwers Games’ original 2006 multilingual Project X, which preceded the Pictureka name and later Hasbro editions. The original manual and its exact winning threshold remain unverified; the listed counts and duration come from a contemporary played review.
