description: |
  Investigate a singer's murder and the boxer accused of it in a card-based Chicago mystery. Together, choose which witnesses and places to examine within a budget of 24 actions, then compare your explanation with the solution. Illustration details can matter as much as the text. The rules use QR-linked questions and answers; you can download those files beforehand without reading them for offline play.

  This record represents the Russian-language 2024 Hobby World edition, labeled for adults and lasting 60–90 minutes. The English display title is a translation, not confirmation of an English retail edition. Expect a shared, reading-heavy investigation whose solution is known after playing; preferred counts and experience ratings remain provisional.

