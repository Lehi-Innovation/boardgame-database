description: |
  Korsar is Heidelberger's 2002 edition of Reiner Knizia's pirate card game,
  previously published as Pirat by AMIGO in 1992. Send merchant ships to sea,
  attack exposed ships with pirates or draw cards to improve your options.
  A ship has to survive until its owner's next turn, or an attacker must retain
  the strongest claim until their next turn, before the gold can be secured.

  Tied attacks remain unresolved, and merchant ships left in your hand can
  subtract from your haul at the end. Captains and the admiral can change a
  contest quickly. Ordinary play supports two to five; the represented edition
  also offers partnership play at four, six or eight. Those extra seats do not
  apply to every earlier Pirat printing. Expect direct rivalry and changing
  targets rather than a quiet exercise in optimizing a private hand.

