description: |
  Command opposing forces in a large science-fiction war over a galaxy. Excalibre advertised four connected map sections, hundreds of counters and secret weapons, making this a substantial table-space commitment. Expect a sprawling conflict with a large force to manage. Contemporary reviews criticized the rules’ clarity, so arranging clarifications before play may matter as much as learning the basic system. The original advertisement says two or more players; the practical upper limit, exact duration and age guidance remain unverified.

