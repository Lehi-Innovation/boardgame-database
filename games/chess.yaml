description: |
  Two opponents move pieces on an eight-by-eight board, trying to checkmate
  the other king. Each starts with sixteen pieces whose different movements
  create threats, exchanges and opportunities to protect or attack important
  squares. Both players can see the whole position.

  Expect sustained planning and direct competition; those experience ratings
  remain provisional. Playing time depends on the agreed time controls, so the
  nominal hour here is an illustrative session estimate. This record covers
  standard two-player chess, including the retired duplicate named that way;
  it does not treat multiplayer variants as the same game.

