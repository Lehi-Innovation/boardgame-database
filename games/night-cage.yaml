description: |
  Find keys and gather every prisoner at the same gate before the darkness overwhelms you. Candles reveal only connected nearby passages; tiles that lose all light are discarded, steadily consuming the maze’s finite supply. Moving can expose a route or trigger a Wax Eater along a clear line of sight, so the group must weigh individual movement against everyone’s safety. One to four players control four prisoners between them, while five players use five. Solo play manages all four. The original base game includes advanced threats; the later Shrieking Hollow expansion is separate. Expect tense discussion, shared planning and frequent reversals.

