description: |
  Sail between islands collecting treasure and return it to your own harbor. The first captain to bank ten pieces wins, but a ship carrying more than seven capsizes and loses its entire cargo. Some islands offer a choice of how much to load; others force extra treasure aboard. Meeting rivals can let you steal from them or overload their ships, while a tornado and wind wheel can redistribute cargo or move boats. Dice add uncertainty to the decisions about greed and safety. This is the original Selecta game, separate from the later illustrated reissue.

