description: |-
  Place nine counters each on the board’s 24 points, then slide counters along its lines. Making a row of three lets you remove an opposing counter. The contest is won by reducing the opponent to two counters or leaving them unable to move. Threatening two lines at once can force a difficult choice, and reopening a completed line creates recurring threats. A drawn board and eighteen counters are sufficient. Agree beforehand whether a player reduced to three counters may jump to any empty point; this flying rule varies between versions.
