description: |
  Cross the river by building a path of stones and wooden planks while other players try to complete crossings of their own. Program actions in advance, then see how building, movement and interference change the routes before every planned action resolves. A useful bridge may help a rival, and a removed plank can undo a careful plan. This record represents Roberto Fraga’s original Descartes/Eurogames game, published in 2000. Its island-based board is distinct from the later double-sided River Dragons reissue. Original printing labels and art credits remain unverified; allow time for unpredictable movement and disrupted plans.
