description: |
  Jumbulaya is a word-building contest on nine shared rows. Rearrange an existing
  word, add tiles or trade tiles from your rack to make a different word, then
  take ownership of that row. Each turn can add or exchange at most two tiles
  from your rack, so another player's word can become your opportunity.

  Once all rows contain claimed words and at least one is seven tiles long,
  anyone can call a Jumbulaya: a seven-, eight- or nine-tile word taking at most
  one tile from each row in top-to-bottom order. The letters need not share a
  column. This ends play but does not automatically win it: score controlled
  rows, the Jumbulaya and letter-combination bonuses. A ten-tile horizontal word
  or claiming all nine rows also ends play. Most points wins. Expect vocabulary
  challenges and deliberate thinking, rather than a timed shouting game.

