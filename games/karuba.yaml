description: |
  Karuba is a simultaneous route-building race on separate jungle boards. Each
  round, an expedition leader reveals a numbered tile and everyone uses the
  same tile. Place it to extend paths, or discard it to move an adventurer along
  an existing route. The number of path exits on the discarded tile determines
  the movement available, creating a choice between building and progressing.

  Guide four adventurers to matching temples while collecting crystals and
  gold along the way. Earlier temple arrivals take the most valuable remaining
  treasure, so speed earns more temple points, not fewer. A fast route can still
  miss valuable pickups or obstruct another adventurer. Play ends when the tile
  supply runs out or someone brings all four adventurers to their temples;
  total treasure decides the winner. The 2016 award nomination followed the
  original 2015 publication.

