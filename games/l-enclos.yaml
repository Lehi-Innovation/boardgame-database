description: |
  Move your sheep through adjacent spaces and place barriers to restrict your opponent. Each turn includes a sheep move and a new barrier, in either order; the aim is to leave the other player's three sheep unable to move. The visible board and permanent barriers make preserving escape routes part of the puzzle. Independent rules references identify Michel Boutin's 1986 educational-journal game. The original journal issue was not inspected in this review, and timing and experience assessments remain provisional.

