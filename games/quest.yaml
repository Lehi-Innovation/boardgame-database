description: |
  Take a secret role among King Arthur’s servants and Mordred’s infiltrators. Discuss whom to trust, then let a leader choose a team for a mission without an approval vote. Team members secretly submit cards that can help or sabotage it. Special roles, magic and clues about loyalties complicate accusations, while the next leader is chosen by the current one. A late attempt to identify the infiltrators can still change the result. This is a social deduction game driven by conversation, bluffing and reading the group. Check the selected role set and base-game or Director’s Cut rules before starting, because their endings differ.

