description: |
  Just4Fun Colours is a standalone color-based relative of Just 4 Fun. Play
  matching color cards to place a stone on an empty space or on top of a stack.
  An occupied space costs one more card than the stack's height, and whoever
  has the top stone controls it. Unlike the numbered game, control does not
  depend on having the most stones of your color in that space.

  Make a horizontal, vertical or diagonal line of four controlled spaces to
  win. If nobody does so after twenty turns each, compare the largest connected
  areas, using horizontal and vertical connections. Rising costs make taking
  a useful space easier early than late. This record represents the larger
  two-to-four-player KOSMOS set; the separate two-player travel package has
  different component quantities. No copy of the numbered game is required.

