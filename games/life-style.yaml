description: |
  How well do you know the people at the table? One player privately ranks four photographs in response to a question about tastes or preferences; everyone else tries to predict that ranking. Matching positions moves your pawn along the scoring track, while the reveals invite people to explain their choices. Optional advanced rules add favorite and joker markers. The German-language questions and pictures are central to play.

