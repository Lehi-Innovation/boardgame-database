description: |
  The original Jactalea Kamon is a two-player connection game using symbols and
  quantities. Randomly place the tokens on a hexagonal board, then leave the
  starting token's space blocked. Black's first placement must be on an edge
  away from a corner. Each later move must match either the symbol or the number
  of symbols on the token taken by the opponent's previous move.

  Replace a token with your own piece and try to connect opposite matching edges,
  form a loop enclosing an empty or opposing space, or prevent the opponent
  from making a legal placement. If both players exhaust their pieces without
  a winning condition, the game is drawn. Every choice narrows the opponent's
  reply, so a promising connection also needs a plan for the next constraint.
  The later Cosmoludo revision uses colors in place of the original quantities.

