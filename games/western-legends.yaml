description: |
  Choose how to build a reputation in the American West. Prospect for gold,
  drive cattle, gamble, rob or uphold the law, pursuing different routes to
  legendary status on a shared map. The activities you choose can put you in
  conflict with other players as well as the game's obstacles.

  This record represents the original 2018 base game, which supports two to six
  players. Expansions add further options but are not needed to play. Expect a
  session of choosing your own direction and responding to other people's plans;
  that experience assessment and the preferred group sizes remain provisional.

