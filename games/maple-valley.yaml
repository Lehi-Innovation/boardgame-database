description: |
  Recruit young woodland friends and use their travel skills to follow forest, rock and water trails, gathering supplies for a spring festival. Turn those supplies into favors, collect useful patches and plan a route that lets your cards work together. Everyone contributes to the same celebration, but each player builds a separate score; supplying festivities creates competition for bonus points. Play lasts five rounds, with a solo version that omits the festivities. It shares Creature Comforts’ setting, with different rules and no other box required. Expect card reading and planning; a deliberate group may exceed the listed duration.

