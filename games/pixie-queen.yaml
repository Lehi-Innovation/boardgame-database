description: |
  Compete to satisfy a demanding queen by gathering food and precious metals, placing action discs and making secret offerings. Promoting your pixies can improve their work and eventually make them loyal palace servants, while rivals can steal resources or interfere with your plans. Penalties drag scores downward during play; final rewards offset them. Finish with the best total, whether that means the fewest remaining penalties or the most positive points. Play lasts up to seven rounds and can end earlier when the main reward tiles run out. Expect a substantial, confrontational strategy game with several phases and a special two-player setup.

