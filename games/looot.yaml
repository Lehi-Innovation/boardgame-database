description: |
  Place Vikings on a shared landscape to gather resources and capture buildings, then fit those rewards into your own fjord. Resources placed around longships and construction sites complete requirements and improve your scoring. Meanwhile, the shared map rewards useful connections and quick access to valuable spaces. You have only thirteen Vikings, three special shields and limited room in your fjord, so each placement shapes later choices. Unfinished longships cost points.

