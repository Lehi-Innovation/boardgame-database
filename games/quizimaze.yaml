description: |
  Roll a die and navigate a maze of movable gates and question spaces. Answer illustrated questions from four subjects to continue your turn and earn opportunities to turn gates, opening routes for yourself or slowing rivals. Visit the four corner knowledge bases and answer correctly to collect one chip in each subject; the first to collect all four wins. Gates can move after setup, but the underlying maze-square cards stay in place during play. The instructions allow two to eight players and estimate one to three hours, with shorter games possible by agreeing to collect fewer chips. Expect both factual recall and tactical interference.

