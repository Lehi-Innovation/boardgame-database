description: |
  Competing teams try to shed their cards. Everyone plays a card each turn; the
  strongest card is discarded, but card powers can change what else disappears.
  Cards left in play return to their owners, and a team wins the round when one
  of its members has only one card remaining.

  Use effects to help a partner or obstruct an opponent. Expect a short contest
  of timing and shifting card combinations; that experience assessment remains
  provisional. The publisher supports four to six players, age ten and up. This
  is team competition rather than a game in which everyone wins together.

