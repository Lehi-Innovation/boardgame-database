description: |
  Buy and develop property, collect rent and negotiate trades on a French Monopoly board using Parisian streets. This record represents a historical Miro Company edition, rather than the unsupported modern city-souvenir edition previously described here. A collector's inspected set has rules with a first-quarter 1948 legal-deposit notice; that dates the represented rules but does not establish the exact age of its box or the first French publication of Monopoly. Supported player counts and age for this edition remain unverified, and timing and experience ratings are provisional.

