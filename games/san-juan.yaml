description: |
  Build a city by deciding which cards to construct and which to discard as
  payment. Cards also represent goods when placed face down on production
  buildings. Each selected role offers an action and a privilege to its chooser;
  most roles also let everyone else act. The prospector benefits only its chooser.

  Roles and buildings help you draw cards, produce goods and trade them for more
  cards. The game ends after the building phase in which someone reaches twelve
  buildings, and the most victory points wins. This record represents the original
  2004 110-card base game. Its separate 2014 second edition includes additional
  buildings; those cards are not assumed to be in this original set.

