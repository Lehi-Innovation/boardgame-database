description: |
  Negotiate alliances and coordinate armies and fleets on a map of Europe, then commit to orders that may expose whether your allies kept their promises. Control of supply centers supports your forces; agreements rely on trust rather than binding contracts. The original rules recommend seven players and allow groups as small as three. Expect sustained conversation, direct conflict and the possibility of elimination, with an agreed time limit useful for planning a session. This record follows the original 1959 game, separate from the five-player ancient-world Classical Diplomacy variant. Session length and experience ratings are provisional.

