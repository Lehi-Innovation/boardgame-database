# Description
description: |
  Work as a team to match hidden numbered wires while a wrong cut moves the bomb
  closer to exploding. You know your own wires but must infer where matching values
  sit on teammates’ racks. Missions gradually add equipment and complications; the
  66 missions are replayable and components are not destroyed. It suits a group
  that enjoys joint deduction and learning through short challenges. Red wires
  create risk, and later missions need more coordination. First released in 2024,
  Bomb Busters won the Spiel des Jahres in 2025.

