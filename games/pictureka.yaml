description: |
  Search a crowded spread of cartoon drawings to complete missions before your opponents or the timer beat you. Challenges mix quick spotting, individual searches and bidding on how many matching objects you can find. Tiles can move or turn over, changing where familiar pictures appear. The 2007 Parker Brothers game ends when someone collects six mission cards. Its rules support two or more players, though larger groups need room to see and reach the pictures fairly. This record represents the early U.S. edition, following Lauwers Games’ Project X and preceding later Pictureka revisions.

