description: |
  Build a hand of exactly ten cards, announce “It’s Muffin Time!” and try to keep that hand until your next turn begins. Each turn lets you set one hidden trap before either drawing a card or playing an action. Traps react to what people do, while counter cards interrupt actions and other counters; a well-timed exchange can overturn an apparent win. The asdfmovie humor and frequent interference make this a noisy, unpredictable party game. Reading card text and watching for triggers matter more than long-term planning. This record represents the original retail game, before later expanded editions.

