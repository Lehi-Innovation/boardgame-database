description: |
  Drive cattle to Abilene for cash while your cowboys protect your herds or steal
  someone else's. Stolen cattle pay extra, but raids can trigger dice-driven
  duels that kill cowboys. Herd health is hidden: an opponent who correctly calls
  out diseased cattle can profit from your delivery. Winning depends on money,
  rather than simply reaching town first.

  This record represents the original Hexagames game cataloged in 1983, distinct
  from Schmidt's revised 1993 version. The award jury recommends two or three
  players and about 45 minutes; Luding lists three and 90 minutes. Both recommend
  age seven. Original rules and packaging were not inspected to settle those
  differences, so allow extra time when learning.

