description: |
  Develop a display of city cards, acquire London boroughs and choose when to run your buildings for income and prestige. Bigger displays and loans can accelerate development, but running the city also produces poverty; planning what stays in your hand is part of that tradeoff. Borough cards grant immediate benefits and change your active borough ability. When the city deck empties, the final turns lead to prestige scoring and penalties for debt and poverty. This 2017 Osprey revision replaces the original edition’s borough map with cards and revises its rules. It is a separate edition, not an expansion requiring the 2010 box.
