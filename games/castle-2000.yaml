description: |
  Try to place the characters in your hand into a crowded castle. Almost every
  character has a different ability, letting cards create opportunities, combine
  with others or eject an opponent's people. Characters can move between the
  castle and players' hands, changing which combinations are useful.

  This is Bruno Faidutti and Serge Laget's 2000 card game, also called Castel,
  illustrated by Emmanuel Roudier. Expect tactical combinations and direct
  interference; that experience assessment and the preferred counts are provisional.
  It is separate from the Carcassonne spinoff and Mayfair's earlier The Castle.

