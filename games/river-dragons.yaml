description: |
  Race across a river by balancing wooden planks on stones to make a route. Everyone secretly programs five actions, then resolves them in player order: build, remove, move or cancel another color’s action. A safe-looking crossing may disappear before your pawn reaches it, so plans need room for interference and surprises. Everyone programs together, but actions are carried out in order rather than in real time. This record covers the Matagot reissue available in the U.S. in 2013, with a double-sided board. The earlier Dragon Delta has its own record; the changed 2025 product uses different edition details.

