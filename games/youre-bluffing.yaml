description: |
  Auction farm animals and use concealed offers to take matching animals from
  opponents. Only complete sets of four score, so an animal's value depends on
  who needs it and how much cash they can bluff with. Money remaining at the end
  does not score. Reading bids and deciding when to force a trade are central.

  This record represents Ravensburger's original German Kuhhandel, also known
  as You're Bluffing!, with Blaumeiser illustrations. It is unrelated to HABA's
  Tier auf Tier: Das Duell. The original-edition bibliography lists three to five
  and 45 minutes or more; the award jury instead lists three to six and about
  30 minutes. Original box/rules labels were not inspected to settle that conflict.

