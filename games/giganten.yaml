description: |
  Run an oil business in Texas: explore with a truck, erect drilling towers and
  use a locomotive to carry oil to refineries. Action cards combine movement and
  selling licenses, making the choice of a card important for several parts of
  the business. Players then compete at auction for the right to sell oil at
  the current prices.

  Expect a contest over timing, transport and limited selling opportunities;
  that experience assessment remains provisional. This is Wilko Manz's KOSMOS
  game from 1999, nominated for Spiel des Jahres that year. It did not win the
  main award, and it does not represent the earlier same-title catalog entry.

