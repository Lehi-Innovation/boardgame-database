description: |
  Compete to assemble valuable Marvel comic collections across three rounds.
  Different locations use different ways to acquire cards, including drafts and
  bids. Balance heroes, collection size and noteworthy issues such as first
  appearances, then commit selected cards to score your collection.

  This is the 2024 English Arcane Wonders/Spin Master edition, independently
  documented in finished-copy Gen Con coverage. Earlier Brazilian editions and
  translated original rules are distinct publication evidence. The standard
  game is competitive, with solo opposition; a separately published fan-made
  cooperative variant is not an included official mode. Knowing the covers is
  thematic enjoyment rather than a trivia requirement.

