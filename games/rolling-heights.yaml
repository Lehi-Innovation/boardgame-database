description: |
  Roll your worker figures, then use their results to gather materials and construct a city of stacked buildings. Standing workers give their stronger effect, sideways workers give a weaker effect, and exhausted workers provide nothing unless you risk another roll. Completing buildings adds points and new workers, but you can use only a limited workforce each turn. This record follows the original English 2023 release. The publisher supports one to four players despite a multiplayer-only product-page label; its original solo mode needs an ordinary six-sided die that was accidentally omitted from the manufactured box. Experience and preferred-count estimates remain provisional.

