description: |
  Pirat is Reiner Knizia's original AMIGO pirate card game, published in 1992.
  Send a merchant ship to sea and hope it survives a trip around the table,
  or attack another exposed ship with a colored pirate fleet. At the beginning
  of your turn, collect ships you have successfully protected or held with the
  strongest attack. Ties keep a prize contested until someone changes the balance.

  The original set has twenty-one merchant ships, forty pirate ships, four
  pirates and an admiral. Draw a card or play one, balancing the lure of a richer
  fleet against the danger of handing a rival an easy prize. Merchant ships
  still in your hand subtract from the gold you have collected. Most net gold
  wins. This two-to-five-player original is separate from later Korsar editions
  and their additional partnership options.

