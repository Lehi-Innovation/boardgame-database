description: |
  In K2, guide two mountaineers upward and keep them alive through an eighteen-day
  expedition. Everyone chooses three cards from a hand of six simultaneously,
  then resolves movement and acclimatization in turn. Limited room on the route
  can block a climber, and playing the most movement may require taking a risk
  penalty. Tents offer protection but must be placed where they will be useful.

  Weather follows shuffled tiles with a visible forecast; the starting player
  does not choose a new weather condition each round. Higher camps and bad
  weather drain acclimatization, so a summit push can sacrifice a climber's
  accumulated score if survival is neglected. Score the heights reached by
  surviving climbers. Easier/harder routes and summer/winter weather adjust the
  challenge, and the original rules also support solo play.

