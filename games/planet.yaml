description: |
  Draft magnetic landscape tiles and fit them around a twelve-sided planet. Connect habitats while watching the animals available in upcoming rounds. From the third round onward, animal cards reward different patterns: many separate regions, or a large region that touches or avoids another habitat. Your private habitat objective adds another reason to favor particular terrain. Rotating the planet and comparing its surfaces makes this a tactile spatial puzzle, with competition for tiles and animal cards. This record represents the original 2018 European game, using its English rules.

