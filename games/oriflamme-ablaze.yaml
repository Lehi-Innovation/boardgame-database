description: |
  Rival families build influence through a shared line of concealed cards.
  Leaving a card hidden can make it more valuable, while revealing it triggers
  a character or intrigue effect. Opponents can remove cards, steal influence
  or take control of a useful character, so timing matters as much as the card
  itself.

  Ablaze is playable on its own and can also combine with other Oriflamme sets.
  It introduces a different collection of powers for the same contest over the
  throne. Expect bluffing and direct interference; that experience assessment
  and the preferred counts remain provisional. Original French distributor
  specifications give three to five players, age ten and up, about twenty minutes.

