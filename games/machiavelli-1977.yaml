description: |
  Negotiate alliances and compete for territory in Renaissance Italy, using armies, fleets, money and garrisons. It develops Diplomacy’s system of simultaneous orders with financial decisions and opportunities to undermine another ruler. Agreements depend on the people at the table, so bargaining and broken promises can matter as much as military position. Allow a substantial session and a group comfortable with direct conflict. This record represents the original 1977 Battleline game, separate from later Avalon Hill revisions and from Citadels, which also uses Machiavelli as a localized title. Detailed first-edition rules and timing remain unverified.
