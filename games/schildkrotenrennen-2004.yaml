description: |
  Help your secretly assigned turtle reach the lettuce patch first. Each turn, play a card to move a turtle, then replace the card. Landing on another turtle makes a stack; moving a turtle carries the riders above it while leaving those below behind. You may have to move a rival, or hide your interest by helping a different color. When turtles reach the finish together, the bottom turtle wins under the consulted German rules. Younger players can use the open-color variant. This record covers the original German turtle game, separately from SimplyFun’s later frog-themed Ribbit.
