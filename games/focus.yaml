# Description
description: |
  This is the 1980 Parker German edition of Sid Sackson's abstract stacking game,
  which won the Spiel des Jahres in 1981. The design was already available in
  earlier forms; 1981 is its award year, and KOSMOS published a later 1995 edition.
  Milton Bradley's 1982 English Domination is represented separately.

  On a checkerboard with three squares removed from each corner, control a stack
  by keeping your color on top. Move an entire stack or just its top portion
  orthogonally by exactly the number of pieces being moved. Landing on another
  stack merges them. Above five pieces, remove the excess from the bottom:
  opponents' pieces are captured, while your own become reserves that can be
  returned to the board instead of making a move. In the two-player game, leave
  the opponent without a legal move. Four players form partnerships; three-player
  rules use capture goals. The changing ownership and reserves require attention
  to threats across several turns.

# Award jury specifies 2–4, 10+ and about 60 minutes, not an inspected box label.
