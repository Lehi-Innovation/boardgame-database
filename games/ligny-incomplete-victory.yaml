description: |
  Command opposing French and Prussian forces at Ligny in this historical hex-and-counter battle game. It belongs to Kevin Zucker's original 1976 SPI Napoleon's Last Battles group, whose four battle maps can also form a larger campaign. This record represents the individual Ligny folio, rather than a later edition or the combined campaign. Expect military positioning on a historical map; duration, experience ratings and the existing two-player setup remain provisional pending an original standalone rules review.

