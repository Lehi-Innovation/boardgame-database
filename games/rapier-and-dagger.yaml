description: |
  Resolve individual fencing encounters with rules that distinguish fighting styles and weapons. The booklet offers a paper-and-pencil system that needs no miniatures, plus a system for miniature figures. It is a set of swordplay rules rather than an abstract game guaranteed to include a particular grid or pieces. This record represents Wilf K. Backhaus's original 1978 Fantasy Games Unlimited publication. It covers a two-opponent duel; duration and experience estimates remain provisional, and the complete original rules were not inspected in this identity review.

