description: |
  Bid shells to claim resource sites and connect them to coastal spaces where you can erect moai. The highest bidder pays for the most placements, while bidding nothing can recover shells for later rounds. You need shells for construction too, so winning every auction can leave you short. Build your own statues and then the shared final statue to win; the number of personal statues depends on the player count, so it is not always a seventh statue. If resources run out first, remaining statues and shells decide the result. This record follows Ravensburger's original 2014 game. Preferred counts and experience estimates remain provisional.

