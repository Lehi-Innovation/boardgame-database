description: |
  Turn cards into buildings, spend other cards to pay for them, and use face-down
  cards as goods. Players choose roles that usually let everyone act while giving
  the chooser an extra benefit. The prospector is an exception: only its chooser
  draws a card. Choosing roles at the right moment can help your city more than
  your rivals' cities.

  This is Ravensburger's 2014 English second edition. Its rules list the original
  110-card base deck plus 33 expansion cards and a separate cathedral card, rather
  than only 110 cards in the whole set. It includes extra buildings, including the
  hut, but not the Treasure Chest event cards. The core game still ends when a
  player builds a twelfth building; building abilities determine final points.

