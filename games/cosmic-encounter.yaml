# Description
description: |
  Spread colonies into other players' systems using force, negotiation and an
  alien power that overrides ordinary rules. A destiny draw selects the target;
  both sides invite allies before revealing encounter cards. Allies can profit
  from helping, so choosing whom to trust matters as much as attack strength.
  Players reaching five foreign colonies together can share victory.

  This record represents Fantasy Flight's 2008 base game: three to five players,
  fifty alien sheets, flares and optional technology. Wilson's development and
  new-alien work are distinct from the four original designers' credits. The
  original Eon 1977 set has its own record; extra-player expansions are not
  assumed to come with either base set.

