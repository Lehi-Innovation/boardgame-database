# Description
description: |
  Command Union or Confederate troops in American Civil War scenarios. Your command cards determine which units can act, terrain shapes movement and protection, and custom dice resolve attacks and retreats. Capturing enemy flags wins the battle. This record follows Richard Borg's Avalon Hill / Hasbro game described in a June 2000 play review, with fifteen included scenarios. It is separate from the earlier Milton Bradley title and later anniversary edition. Evidence differs over the earliest 1999/2000 publication chronology; this record describes the reviewed 2000 version. Scenario duration and experience assessments remain provisional.

