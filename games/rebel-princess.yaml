description: |
  Play cards into tricks while trying to avoid unwanted marriage proposals. Prince cards bring penalties, and the frog hidden among the pets is especially costly. Follow the led suit when you can, but watch for ways to pass troublesome cards to rivals. Each of five rounds adds a new rule, and your chosen princess has a power you can use once per round. The Deluxe edition also rewards collecting every prince and the frog with a negative score, offering a risky way to recover. Familiar card-play habits help, but changing round rules and powers create surprises. This record covers Bézier’s 2024 English Deluxe edition; a shorter three-round game is optional.

