description: |
  Lead a Marvel superhero team through missions across New York while also controlling the mastermind opposing another player’s team. Headlines provide threats to investigate and fight, with character powers, cards and dice shaping each encounter. Your villainous role keeps you involved when rivals send their heroes into danger, so this is a competitive game despite the shared superhero setting. Expect a substantial rules framework, tactical fights and an approximately two-hour session. This 2006 Nexus game distributed by Fantasy Flight is separate from the older Milton Bradley superhero game.
