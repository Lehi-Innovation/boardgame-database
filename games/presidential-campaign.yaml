description: |
  Compete for electoral votes as rival political parties choosing presidential and vice-presidential candidates and campaigning across the United States. Cards and state-by-state decisions shape the election; the supported two-to-four-player arrangements divide party responsibilities differently. This record represents 3M’s 1967 standard revision of Mr. President, following earlier chalkboard and dial versions. It is separate from GMT’s much later solo game about governing after an election. Approximate session time and preferred counts remain provisional.

