description: |
  Race your pieces home along a shared track, with the die deciding how far you can move. Landing on a rival sends their piece back to the start, so a small lead can disappear quickly. Expect simple choices, luck and repeated setbacks rather than a quiet planning puzzle. The Nürnberg Toy Museum dates commercial production to 1914 and distinguishes it from earlier private copies made by Josef Friedrich Schmidt. This record represents that original commercial game; timing and preferred player counts remain provisional.

