description: |
  This record represents Richard Borg's 1987 Milton Bradley boxed Liar's Dice,
  with six cups, thirty player dice and a board for tracking bids. Players look
  under their own cups, then raise claims about matching faces across the table
  or challenge the previous claim. Reveals cost dice, and the last player with
  dice remaining wins. Borg's design includes the option to expose dice and
  reroll the remainder, adding decisions beyond the opening hidden roll.

  Bluff (F.X. Schmid, 1993) and Call My Bluff (F.X. Schmid U.S.A., 1997) are
  separately represented editions. The award belongs to the German Bluff
  edition. Traditional games called Dudo or Liar's Dice have related bidding
  ideas and different rules; their uncertain origins are not a publication date
  or designer credit for this commercial game.

