description: |
  Command opposing German and Soviet forces in Eastern Front battles. James Dunnigan describes his design as regimental operations in Russia during 1943–44, emphasizing differences in how the two armies fight. This record represents the original 1971 SPI game, rather than an unrelated later title. Expect a military positioning contest on a hex map; experience ratings remain provisional, and the nominal two-hour duration comes from a retailer listing rather than an original box label.

