description: |
  This French Habourdin children's game adapts musical chairs to small figures at the table. A secondary description reports placing bear figures on chairs when music stops, with cake pieces at stake. The complete original rules were not inspected, so the earlier guessed spinner, dice and elimination sequence are not treated as established facts. Festival history identifies the game and its designer in the 1994 Benjamin award category; references disagree on a 1991 or 1992 release. The edition catalog lists two to four players, while timing and experience assessments remain provisional.

