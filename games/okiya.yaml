description: |
  Replace garden tiles with your clan’s tokens on a four-by-four grid. The tile you remove determines your opponent’s next options: their choice must share its plant or poetic symbol. Win by making a line of four, a two-by-two square or a position that leaves the other player unable to move. The first move must start at the border. Short turns and a single placement restriction create a compact contest of threats and forced replies. This record represents the original 2012 Jactalea game; Niya is its later American title, with different packaging.

