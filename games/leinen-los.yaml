description: |
  Race small wooden motorboats around a course by pushing them with one finger.
  Each boat's loose motor makes it difficult to steer, and hitting a buoy or
  spinning around ends the move. Another player winds a cord around a wooden
  bollard to determine how long the boat may travel.

  This short dexterity race supports two to four people from age six according
  to the award jury. Expect careful steering mixed with hurried mistakes; that
  experience assessment remains provisional. The original HABA game appeared in
  1996 and received the children's special prize in 1997. The prior record's
  Ravensburger roll-and-write identity was unsupported and has been corrected.

