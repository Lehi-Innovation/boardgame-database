description: |
  This early Finnish air-race game has a looped track, a marked start and finish, and illustrations of aircraft and aviators. The National Library of Finland identifies the original as an Osakeyhtiö Launis publication from 1909, separate from its 2018 digital edition. Its digitized copy preserves the box and board but explicitly lacks the rules. The original movement rules, supported player counts and age label are therefore unverified; timing and experience ratings here are provisional rather than instructions for reconstructing the game.

