description: |
  Run a space program in a race to land astronauts on the Moon and bring them home. Spend a limited budget on hardware, research and crews, then decide how much risk to accept when scheduling missions. Reliability checks can turn a carefully prepared launch into a setback; successful milestones improve your program’s prospects. Expect record keeping and a substantial rules commitment. This record represents Task Force Games’ 1989 simulation, separate from the 2018 Lift Off card-drafting game and the later Liftoff! 2.0 revision. Original-edition age and session-duration labels remain unverified.

