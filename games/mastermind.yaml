description: |
  One player hides a sequence of colored pegs while the other tries to discover it through successive guesses. Small feedback pegs report correct colors in the correct places and correct colors placed elsewhere, without identifying which pegs earned that feedback. Each guess narrows the possibilities, creating a compact exercise in logical deduction. Swap the code-making and code-breaking roles to compare results. This record represents the original Invicta peg game; later electronic versions and sets with different code lengths have their own rules. The approximate session time and experience ratings are provisional.

