description: |
  Build rail routes west from Chicago, cross the Mississippi and try to get your train to Kansas City first. Construction crews develop tracks, and altering a route can obstruct another player as well as open your own path. The shared network makes progress depend on what rivals build and change. This record represents Michael Blumöhr’s 1987 Hans im Glück German game. Its full original rules have not been inspected, so precise movement and special-die effects are not asserted here. Mattel’s Zug nach Westen is a related later version with separately credited development.

