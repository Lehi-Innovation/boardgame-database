description: |
  Place a disc so that it traps a straight line of your opponent’s discs between your new disc and one already showing your color, then flip every trapped line. Black starts from the fixed four-disc center position. You must move when able and pass when you cannot; the game ends when neither player can move, even if empty squares remain. The player with more discs wins. Simple turns conceal a demanding contest over mobility, edges and timing. This record represents modern Othello, commercially launched in Japan in 1973. Earlier Reversi games have their own histories and rule variants.

