description: |
  Bluff is the 1993 German F.X. Schmid edition of Richard Borg's cup-and-dice
  bidding game and that year's Spiel des Jahres winner. Start with five dice
  hidden under each player's cup and use the board to track increasing claims
  about how many matching faces are present across the table. Stars count as
  wilds for number bids. Raise the claim or challenge the previous bidder.

  On a reveal, an overstated bid costs the bidder dice; a mistaken challenge
  costs the challenger dice. The loss equals the gap between the bid and the
  actual count. An exactly correct bid makes every other player lose one die.
  Stay in by balancing odds, bluffing and timely challenges until only one
  player has dice. Earlier Milton Bradley Liar's Dice (1987) and later English
  Call My Bluff (1997) have separate records; their labels are not original
  German-box specifications.

