description: |
  Build a small orchard by overlapping cards so that matching fruit trees cover one another. Dice record the growing harvest rather than being rolled, while two rotten-fruit tokens let you accept mismatches at a points cost. Each placement changes the space available for the remaining cards, creating a short puzzle about improving your harvest score. A session uses nine of the box’s eighteen cards. One copy supports solo play; the simultaneous comparison mode requires a separate copy for each participant. This record represents the manufactured Side Room game available in 2020, following Tuck’s 2018 print-and-play design. It is separate from HABA’s children’s Orchard.

