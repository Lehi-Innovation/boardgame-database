description: |
  Command armies on a world map, reinforce the territories you hold and attack neighboring rivals with dice. Controlling a whole continent gives extra troops, but expanding can leave a border exposed. Short agreements may help you survive an enemy’s attack, while the conquest objective ultimately puts every other player in your way. A defeated player leaves the game before the final winner is decided. This record represents Miro’s original French game from 1957, the predecessor to Parker Brothers’ 1959 Risk. The consulted scan supports three to six players; its exact printing and original age guidance remain unknown.
