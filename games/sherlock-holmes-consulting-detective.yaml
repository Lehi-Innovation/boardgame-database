# Description
description: |
  Follow written leads through a Victorian London map, directory and newspaper
  archive, then answer questions about the crime. The original game has ten cases.
  Solve them alone, agree on a shared solution, or compete to submit individual
  solutions. Compare your result and investigation length with Holmes's answer.

  This record represents the original English Sleuth Publications game, cataloged
  as 1981; some references instead date its boxed release to 1982. The 1985 award
  was for the German Criminal-Cabinet, not the original publication date. Later
  Space Cowboys collections have revised material and their own specifications.
  Reading, careful notes and discussion drive play; once a case's solution is
  known, its surprise cannot simply be replayed with the same investigators.

