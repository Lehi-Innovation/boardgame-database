description: |
  Jurassic Parts puts competing paleontologists around one slab of fossil tiles.
  Sharpen chisels and place them in cracks between tiles, spending extra effort
  on rocky edges. When a section splits away, contributors claim tiles in order
  of their investment: the leading contributor takes half, rounded up, subject
  to a six-tile limit, before the next contributor chooses from what remains.

  Complete dinosaur skeletons for points and amber, or collect plants and trade
  with the Field Leader to improve a difficult position. All players affect the
  same excavation, so a useful cut can also open an opportunity for a rival.
  The shrinking slab creates a compact contest over timing, shared boundaries
  and finishing sets.

