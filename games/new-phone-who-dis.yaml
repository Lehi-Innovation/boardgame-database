description: |
  Match an absurd reply to a fictional incoming text and try to make the round’s judge laugh. In classic play, choose from seven Reply cards, then refill your hand as judging passes around the group. A second mode gives everyone four Inbox and four Reply cards to build their own funny exchange. Winning pairs earn points; the rules let the group decide how long to keep playing. Expect adult jokes, reading and subjective humor rather than a fixed puzzle solution. This record represents the original adult game, separate from the family edition and the later second edition with new content.

