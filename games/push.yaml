description: |
  Draw cards into up to three shared stacks, keeping repeated colors and numbers out of each stack. Stop to choose a stack for yourself, then let other players claim the remaining stacks. If a card cannot be placed, you get no stack and roll a die that can wipe out an entire color of your exposed cards. Roll cards can cause losses even when collected from someone else’s turn. Spend a turn banking one color to protect it permanently. High numbers score more, so the choice mixes greed, safety and what you leave for others. This is Ravensburger’s 2018 card game, separate from Mühlhäuser’s wooden flicking game.

