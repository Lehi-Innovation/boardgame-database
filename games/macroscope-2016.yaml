description: |
  Recognize a hidden drawing by looking through the few openings in a cardboard viewing device. Roll dice to choose which covers can come off, then decide whether to guess or let the next player see more. An early correct answer earns more crystals, but a wrong answer carries a larger penalty; rivals can also challenge a guess. Compare scores after ten pictures. Simple visual clues make it approachable across ages, though people may find some drawings much harder than others. This record represents the original 2016 Lifestyle game; Mayday’s later English edition is recorded separately.
