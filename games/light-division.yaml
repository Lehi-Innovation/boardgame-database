description: |
  Command forces in hypothetical late-Cold-War fighting around Bandar Abbas and the Strait of Hormuz. American forces need ports, airfields and a workable foothold while Iranian or Soviet opposition contests the invasion. A die roll determines how many operations you can carry out in a cycle, making coordinated movement and supporting fire uncertain. Scenarios vary considerably in length; one played review reports an introductory scenario under two hours, while the retailer lists about four hours overall. Solo play means handling both sides. Consult the published map corrections before setting up. This is 3W’s 1989 modern-conflict game.

