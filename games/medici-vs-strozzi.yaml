description: |
  Two rival merchant families buy goods to fill ships and compete for business
  at three ports. One player draws a small lot of goods tiles and sets its price.
  The opponent may buy it; if they decline, the price-setter must pay instead.
  The value of the same lot can differ sharply between the two businesses.

  This separate two-player game was published in 2006 by ABACUSSPIELE and Rio
  Grande Games, according to Reiner Knizia's own game list. Expect repeated
  judgments about what your opponent needs and what you can afford; that
  experience assessment remains provisional.

