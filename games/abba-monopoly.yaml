# Description
description: |
  Buy ABBA singles and build recording studios as you move around a themed
  Monopoly board. Rent and trading drive the competition, with bankruptcy still
  a practical risk. Six themed tokens reference the band's music and stage
  history, including a platform boot and star-shaped guitar.

  This is Winning Moves UK's English/Swedish The Phenomenon edition, announced
  for December 2014. Both languages appear in the same set. The familiar financial
  game remains central; knowing ABBA's music is part of the theme rather than a
  trivia challenge.

