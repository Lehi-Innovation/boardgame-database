description: |
  Rome and Carthage contest the Mediterranean during the Second Punic War.
  Strategy cards offer a choice between events and operations such as moving
  armies, recruiting or spreading political control. Battles use a separate hand
  of tactical cards. Military success matters, but holding political influence
  can decide the war even without destroying the enemy army.

  This is Simonitch's original 1996 Avalon Hill game, product 906. It develops
  the earlier card-driven system of We the People; it did not introduce that
  system to wargaming. Both players must read their changing hands and judge
  when to fight or threaten another province. Later Valley Games and PHALANX
  editions have their own revisions and are not represented by this record.

