description: |
  Wahoo is a marble-racing game commonly played on homemade wooden boards, with
  related commercial games including Aggravation. Race four marbles around the
  track and into home, choosing which to move after a die roll. In the documented
  rules, a one or six brings a marble out of its starting area; landing on another
  player's marble sends that marble back to start. Boards may offer a center
  shortcut, and its entry and exit rules should be agreed before play.

  Four- and six-seat boards are available, and some rules support fewer players.
  In partnership play, opposite players cooperate and a finished player can use
  rolls to help the partner. The supported count depends on the board and rules,
  rather than a single historical box. Expect luck, simple movement choices and
  direct setbacks; no drilling or board construction takes place during a game.

# Maker rules and first-hand review establish variants, not a single origin year,
