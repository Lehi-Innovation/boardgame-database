description: |
  Run a United States administration rather than campaign to win office. Set priorities, work with Congress and your cabinet, respond to domestic pressures and manage international crises while events disrupt your plans. This is a substantial solo simulation with many charts, reference booklets and competing demands; a full administration can take several long sessions. Plan for a large table, extra reference space and a place to leave the game set up. This record represents the original 2023 GMT release. The later second edition revises material and is not silently combined here. Other people can discuss decisions, but the supported game is for one player.

