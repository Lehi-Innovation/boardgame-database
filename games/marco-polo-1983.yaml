description: |
  Travel between Venice and Khanbalik, trading goods and collecting the rewards needed for a profitable return. A spinner moves you by land or sea, while dice resolve encounters with bandits and pirates. Deliver gifts to gain a golden tablet, complete a secret mission for an invention and return to Venice with enough wealth to win; the required total changes with player count. Trading and timing create choices within an uncertain journey. This Schmidt game is separate from the later dice-placement Voyages of Marco Polo. The consulted German rules do not establish original illustration credits or session duration.
