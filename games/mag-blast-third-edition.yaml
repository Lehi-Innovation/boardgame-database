description: |
  Build a fleet around your command ship, move defenders into place and spend cards to attack rival ships or reinforce your own. Turns pass clockwise through five phases; some cards can interrupt another player's turn. Losing your command ship eliminates you, so a large group can leave someone watching before the battle ends. Comic space combat and John Kovalic's illustrations set a playful tone despite the direct attacks. This is the 2006 third edition; duration and preferred counts are provisional estimates.

