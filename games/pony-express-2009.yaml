description: |
  Race to Sacramento by rolling poker dice under a cup and announcing a hand. Pay to reroll, or bluff about what you have; nearby riders can challenge your claim. Encounters bring poker games or duels in which players roll a die across the board to hit a rider. Gold and item cards help with obstacles, but chance and dexterity can undo progress. Reaching Sacramento first is not an instant win: finish delivering your mail, or beat the next arrival in a final duel. This 2009 Funforge game mixes bluffing, physical play and a Western race; it is separate from Polygon’s 1947 business game.
