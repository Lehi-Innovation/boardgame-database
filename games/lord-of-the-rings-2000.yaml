description: |
  Work together as hobbits carrying the One Ring toward its destruction. Across four dangerous regions, spend cards to advance activity tracks, gather resources and cope with events before Sauron and corruption overtake the fellowship. Progress on one track can leave another threat neglected, making careful discussion and shared resource planning more useful than a single player racing ahead. Gandalf can help, while using the Ring brings its own risks. Everyone faces the game’s threats together. This record represents Knizia’s original 2000 cooperative board game, separate from The Confrontation, later revised editions and the children’s game.
