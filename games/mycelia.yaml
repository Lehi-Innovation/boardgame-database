description: |
  Spread a fungal network across an expanding landscape of triangular tiles. On each turn, take two different actions from moving, exploring, sporing, growing a mushroom, drawing a card or letting a mushroom decay. The wind die changes where spores spread, while larger mushrooms can block rivals and take control of their spores. After a mushroom has spored twice, decay can unlock useful powers; filling all five decay slots ends the game immediately, with the highest score winning. Botanical artwork accompanies a competitive contest for space and resources. Solo play uses an automated opponent. This is Neville’s Split Stone game, separate from Ravensburger’s same-title deck-building game.

