description: |
  Play a poker contest, then race to empty your hand through runs of cards in the same suit. Before a hand, everyone adds chips to the board’s marked pots; the dealer may exchange for an unseen spare hand or auction it. Agree whether poker uses a simple showdown or betting. During the following card run, particular cards and combinations collect their marked pots. The first player to empty their hand collects the Rummoli pot, and the others pay according to their remaining cards. Unclaimed pots can carry over, creating anticipation between hands. Choose the number of hands together; this record follows Copp Clark’s copyright-1940 Canadian rules, with two to eight players and chips as counters.

