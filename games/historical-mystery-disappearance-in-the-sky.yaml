description: |
  Work together on a card-based investigation into a millionaire's disappearance from a plane and a later death. Spend a limited supply of actions examining places and questioning people, then compare your theory with the case solution. Expect careful reading, visual clues and discussion rather than a physical aviation game. This record follows the Russian-language 2023 product, labeled 18+ and 60–90 minutes; the English display title does not establish English retail availability. Preferred counts and experience estimates remain provisional.

