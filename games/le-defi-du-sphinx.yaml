description: |
  Answer historical questions and riddles to work toward twenty knowledge points in this French-language educational card game. Its subjects include people, monuments and events from antiquity through modern times, rather than only ancient Egypt. The reviewed original-game listing identifies Richard Bourrelly, Ludotech, two to four players, ages ten upward and a nominal half-hour session. The 1997 release is distinct from its 1998 As d'Or junior award. Preferred counts and experience assessments remain provisional.

