description: |
  Remember which colored witch is hiding under each hat. Roll a color, lift the matching hat and move that witch forward if you remembered correctly; a special die result can mix up two hats. The player who moves a witch to the finish wins. Everyone uses the same witches, so this is a light competitive memory race rather than a shared-win puzzle. The translated original rules include a simpler option for younger children that skips the hat swapping.

  This record represents Heinz Meister's 1994 F.X. Schmid game. The archived translation recommends ages three and a half upward; Zoch's later edition has its own labeling. Timing, preferred counts and experience ratings remain provisional.

