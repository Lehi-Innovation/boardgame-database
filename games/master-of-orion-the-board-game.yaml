description: |
  Build a civilization by stacking cards into planetary systems and managing food, fleet strength, production and loyalty. New cards can improve your economy or change the actions available to you, while covering an earlier card's special ability. Attacks normally earn points and reduce an opponent's loyalty rather than destroy their cards. The winner has the most points when the game ends, so triggering the end does not guarantee victory. This record represents Cryptozoic's 2017 English edition; the original 2016 Hobby World game has a separate record. Preferred counts and experience ratings remain provisional.

