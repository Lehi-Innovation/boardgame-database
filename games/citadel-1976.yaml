description: |
  One player sends an adventurer into a dead wizard’s tower in search of a talisman, while the opponent controls its dangers. Search through a six-level tower and try to escape with the prize. The opposing roles create a contest between exploration and defending the tower, rather than a shared cooperative quest. This is Fantasy Games Unlimited’s 1976 booklet game with Roy G. Krenkel illustrations, separate from Faidutti’s later Citadels card game. Original age, session time and component-package details remain unverified; experience estimates are provisional.
