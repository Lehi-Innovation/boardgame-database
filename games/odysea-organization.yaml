description: |
  Use cards about workplace roles, organizational concerns and emotions to start a structured discussion about a real team. Participants choose relevant topics, discuss problems and possible responses, and develop actions to take after the session. This Czech card-based workshop is intended for managers and colleagues, with an advertised two-to-four-hour format. Expect a lengthy discussion about participants’ own working relationships. The public preview omits the complete manual and some cards, so formal participant limits, detailed rules and age guidance remain unknown.

