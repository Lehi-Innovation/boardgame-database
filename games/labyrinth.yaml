description: |
  Shift a row of paths with the spare tile, then move through the newly connected maze toward the treasure shown on your secret card. Other players move the same maze, so a route can disappear before your next turn. Reach all your assigned treasures and return to your starting corner to win. This is Max Kobbert’s family maze game, separate from GMT’s 2010 geopolitical simulation.

