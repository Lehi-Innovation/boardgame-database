description: |
  Build a medieval city by paying gold for district cards, while secretly choosing a different character each round. Characters act in a fixed order and bring income, building advantages or attacks against another role, so guessing what rivals picked matters as much as choosing your own benefit. A city usually triggers the final round at eight districts; the original three-player rules omit the Assassin and require ten. District values and bonuses determine the winner. This record represents the original French Multisim game. Later editions and appended two-player variants change the supported counts and content. Expect direct interference and possible waits between turns.

