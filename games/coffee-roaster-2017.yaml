description: |
  Roast beans by drawing and changing tokens in a bag, balancing the target roast
  against useful flavors and the danger of burning. Decide when to stop and test
  the cup. A single-bean trial takes about ten minutes; a full three-bean menu
  takes about thirty and measures your combined performance.

  This record represents the Japanese/English second-edition issue advertised by
  the creator for spring 2017 and dated by a retailer to that May's Game Market.
  It adds a larger cup board, embossed boards, plastic storage and an easier
  reverse-side layout. The creator describes the core rules as unchanged. Later
  creator retrospectives instead call the second edition 2016; that chronology
  disagreement remains explicit. This is distinct from both the 2015 original
  and the redesigned international artwork/effects of 2019.

