description: |
  Roll a colored die, then carefully place a magnetic snake egg on a matching snake on the board. Other eggs may shift as the magnet approaches. If eggs snap together, take the joined group back into your supply; if an egg leaves the board, you must take that too. Be the first to place all your eggs without causing a collision. There is no timer: the suspense comes from judging magnetic attraction and finding a safe place to set your egg. This is Nexus’s magnetic dexterity game, with simple turns and sudden setbacks, rather than a plastic snake-extraction toy.

