description: |
  Draw beans from a bag and manage their rising roast level before they burn.
  Flavor effects alter the bag and unlock useful actions. Choose when to stop,
  then draw a cup test that scores roast, flavor and consistency. You can practice
  on one bean variety or play a three-bean menu whose combined score sets your rank.

  This record represents Saashi & Saashi's original Japanese/English release of
  November 2015. The original cup board was smaller than the revised 2017 set's.
  The later dlp international edition changes artwork and some effects; those
  changes are not assumed here. The publisher describes a ten-minute practice
  course and a roughly thirty-minute full menu, rather than one uniform duration.

