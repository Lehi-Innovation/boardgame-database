description: |
  Compete to develop a crowded city on Catan. Dice generate gold and influence,
  and building permits establish where construction can happen. Larger buildings
  can replace smaller ones, so a productive location may become a target for an
  opponent. Trade sites, the church and city walls offer routes to victory points;
  the first player to ten wins.

  This standalone Catan Adventures game uses its own city grid and construction
  rules. Expect a spatial contest with direct interference as players compete for
  limited room; that experience assessment and the preferred counts are provisional.

