# Description
description: |
  Send agents to claim useful buildings, recruit adventurers and complete quests in the fantasy city of Waterdeep. Buildings offer limited spaces, so a rival can take the action you wanted. Buying new buildings creates opportunities for everyone while rewarding their owner, and Intrigue cards can help you or interfere with other players. After eight rounds, your secret Lord adds points for particular achievements. This is a competitive planning game rather than a role-playing campaign; familiarity with Dungeons & Dragons is unnecessary. The record represents the original 2012 base game for two to five players. Preferred counts and experience assessments remain provisional.

