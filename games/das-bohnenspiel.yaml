description: Two players sow beans around two rows of six pits, trying to collect more seeds than
  their opponent. Where the final bean lands can trigger a capture, so counting ahead and leaving
  an awkward position for the other player matter. The equipment can be simple, but the visible
  board creates a direct planning puzzle. This record covers the German two-row mancala variant;
  the word Bohnenspiel is also used more broadly for other sowing games.
