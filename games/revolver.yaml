description: |
  Play out a western chase as the Colty gang or Colonel McReady’s lawmen. Each side has its own fixed deck, and playing a valuable card can mean discarding other useful cards to pay for it. Take alternating turns at the current battlefield as the chase moves toward the train. The lawmen win by killing all sixteen bandits; the gang can win by surviving the final train turn or by removing all twelve Mexican Border tokens. The sides have different pressures, so learning the card effects and anticipating the opponent matter. This record covers the original White Goblin English base game; expansion deck-building rules and the separate Revolver 2 are outside its scope.

