description: |
  Search a Spanish galleon for missing treasure, choosing which people and places to investigate before your 24 actions run out. Read the cards together, study their illustrations and build an explanation of the theft. The final questions and answers are linked by QR codes; the rules permit downloading those files beforehand without reading them for offline play. Solving the case reveals information that limits repeat investigation with the same group.

  This record represents the Russian-language 2025 Hobby World edition, labeled for adults and lasting 60–90 minutes. Its English display title is a translation, not confirmation of an English retail edition. Preferred counts and experience ratings remain provisional.

