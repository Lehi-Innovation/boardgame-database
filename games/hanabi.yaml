# Description
description: |
  Build five fireworks together while holding your cards so everyone can see them except you. Spend limited clue tokens to identify all cards of one color or number in a teammate's hand, discard to recover a clue, or risk playing a card into a rising sequence. A misplay costs one error token; the third error ends the game. Completing all five sequences scores 25, and exhausting the deck gives everyone one last turn before scoring. This record follows the original French cooperative Hanabi from the 2010 Hanabi & Ikebana box. Ikebana is a separate competitive game using the same components. Later standalone editions have different packaging and variants. Experience and preferred-count estimates remain provisional.

