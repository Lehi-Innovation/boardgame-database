description: |
  Collect flower cards to build beetle colonies and connect them with paths across the garden. An unconnected colony can be taken over by a rival, while completed connections protect colonies and can obstruct opposing routes. With teammates, passing cards is a way to coordinate without discussing strategy. Two or three players compete individually; four or six play in equal teams, and five uses two pairs plus one individual with a special setup. The first team to connect its two sides wins. This record follows the original English 2023 Van Ryder edition with Kristena Derrick's hand-cut artwork. Duration and preferred-count judgments are provisional; supported counts do not imply that every format offers the same experience.

