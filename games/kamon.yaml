description: |
  This is Cosmoludo's 2020 revision of Bruno Cathala's two-player connection
  game. Tokens with colors and symbols are arranged on a hexagonal board.
  Your placement determines the opponent's next choices: they must use an
  available space matching either that color or that symbol. The options narrow
  as the board fills, rewarding attention to the reply you are forcing.

  Win by connecting opposite matching board edges, surrounding at least one
  space you do not control, or leaving the opponent without a legal move. One
  blank space remains blocked. It is a short contest over both connections and
  movement constraints. The original Jactalea edition is separate and matches
  symbol counts instead of this edition's colors.

