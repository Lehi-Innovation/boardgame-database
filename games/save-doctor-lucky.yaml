description: |
  Everyone wants to be remembered as the person who rescued Doctor Lucky from a
  sinking ocean liner. To attempt the winning rescue, another player must be
  watching. Rival rescuers can interfere, but disappearing decks crowd everyone
  together as the ship sinks. If the last deck goes under, everyone loses.

  This is a competitive prequel to Kill Doctor Lucky, with a shared deadline
  rather than a shared victory. Expect comic obstruction and increasingly tight
  positioning; that experience assessment and the preferred counts are provisional.

