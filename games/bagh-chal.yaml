description: |
  Bagh-Chal is a traditional two-player hunt game from Nepal on a board of
  twenty-five connected points. Four tigers begin in the corners, while twenty
  goats start off the board. Goats move first, placing one on an empty point each
  turn until all twenty have entered. Tigers already move or capture during this
  placement stage; they do not wait for the goats to finish setting up.

  A tiger may step along a line to an empty neighboring point, or jump over one
  adjacent goat into an empty point beyond to capture it. Once all goats have
  entered, they move one step along the lines instead of placing. Under the
  represented rules, tigers win by capturing five goats and goats win by leaving
  all four tigers without a legal move. Each side offers a different tactical
  problem: protect escape routes or close them without allowing a capture.

