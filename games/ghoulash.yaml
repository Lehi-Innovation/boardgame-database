description: |
  Explore a monster-filled adventure on paper, using prepared charts while each player acts as the other's game master. Mike Suchcicki describes creating and marketing this compact two-player dungeon adventure in 1982. This record retains that original game, before he and Joe Suchcicki streamlined it into the later one-sheet scenarios. Mutual game mastering does not establish a shared-win cooperative mode. Timing and experience ratings remain provisional; original age and detailed rules specifications are not established by this history review.

