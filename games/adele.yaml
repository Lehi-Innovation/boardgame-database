# Description
description: |
  One player controls a hostile spaceship computer while the others form its
  endangered crew. The astronauts must find and deliver equipment to disconnect
  ADELE or escape; the computer's player places hazards to stop them. Crew members
  hold different pieces of mission information and plan actions behind screens,
  so coordination also risks revealing their intentions to their opponent.

  The main game supports two to five people. A separate official solo rulesheet
  replaces the human computer player with an automated opponent. Expect a tense
  contest between unequal roles; that experience description is a provisional
  assessment of the rules. Publisher history distinguishes its 2021 crowdfunding
  campaign from general availability in January 2022.

